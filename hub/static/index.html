<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SwarmShield</title>
<meta name="viewport" content="width=1920">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
:root{--red:#ff4d5e;--orange:#ff9f1c;--blue:#3aa0ff;--gold:#ffd23f;--grey:#7d8597;--green:#2ee59d;--text:#e6edf7;--muted:#7d8aa3;--panel:#121826;--line:#1f2a3d}
body{background:#0b0f17;color:var(--text);font:17px/1.3 Inter,"Segoe UI",system-ui,sans-serif;overflow:hidden;display:grid;grid-template-rows:62px 50px 50px 1fr 96px;height:100vh}
.hdr{display:flex;align-items:center;gap:14px;padding:0 22px}.hdr h1{font-size:28px;margin:0}.hdr h1 span{color:var(--red)}
.pill{padding:4px 13px;border-radius:999px;font-weight:800;letter-spacing:1px;font-size:16px}.sim{color:var(--gold);border:2px solid var(--gold)}
.on{color:var(--blue);border:2px solid var(--blue)}.off{color:var(--red);border:2px solid var(--red)}.mock{color:#b9c2d3;border:2px dashed #59647a}
.paused{color:#0b0f17;background:var(--gold);animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:.55}}
.mode{color:#c7cfdd;border:2px solid #3a4660;font-size:14px}
.rnd{color:var(--muted);font-size:19px}.keys{margin-left:auto;color:#59647a;font-size:15px}.keys kbd{border:1px solid #3a4660;border-radius:4px;padding:0 6px;color:#9aa6bd}
.timer{font:800 38px ui-monospace,monospace;margin-left:16px}
.phases{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:0 18px}
.ph{border-radius:10px;padding:5px 12px;background:var(--panel);border:2px solid var(--line);color:#59647a;font-weight:800;font-size:16px;display:flex;gap:10px;align-items:center}
.ph i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#1b2333;flex:none}
.ph.done{color:#9aa6bd}.ph.done i{background:#2a3446;color:var(--text)}
.ph.now.red{border-color:var(--red);color:#fff;background:#2a0d14}.ph.now.red i{background:var(--red)}
.ph.now.blue{border-color:var(--blue);color:#fff;background:#06223f}.ph.now.blue i{background:var(--blue)}
.ph.now.orange{border-color:var(--orange);color:#fff;background:#2e1c04}.ph.now.orange i{background:var(--orange)}
.ph.empty{visibility:hidden}
.cap{padding:8px 22px 0;font-size:25px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{display:grid;grid-template-columns:minmax(0,1fr) 540px;gap:12px;padding:6px 18px 10px;min-height:0}
.col{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.p{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;overflow:hidden}
.p h2{margin:0 0 6px;font-size:15px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.apip{padding:4px}.apip svg{width:100%;height:100%;display:block}
.state{font-size:25px;font-weight:900;white-space:nowrap}
.leg{display:flex;gap:14px;font-size:14px;color:#c7cfdd;flex-wrap:wrap}.leg span{display:flex;align-items:center;gap:6px}.leg i{width:14px;height:14px;border-radius:50%;display:inline-block}
.act{display:flex;gap:10px;font-size:16px;padding:4px 0;border-bottom:1px solid #18202f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act .t{color:#59647a;width:50px;flex:none;font-family:ui-monospace,monospace}
.stats{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;padding:0 18px 12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 16px}.stat .v{font:800 34px ui-monospace,monospace;white-space:nowrap}.stat .l{color:#9aa6bd;font-size:15px}
.banner{position:fixed;inset:0;background:#0b0f17d9;display:none;align-items:center;justify-content:center;z-index:9}.banner.show{display:flex}
.bb{background:var(--panel);border:3px solid var(--blue);border-radius:18px;padding:30px 44px;text-align:center;min-width:900px}.bb.loss{border-color:var(--red)}
.bbig{font-size:64px;font-weight:900}.sub{color:#9aa6bd;font-size:24px;margin:6px 0 18px}
.score{margin:0 auto;border-collapse:collapse;font-size:22px}.score td,.score th{padding:8px 22px;border-bottom:1px solid var(--line);text-align:left}
.score th{color:var(--muted);font-size:18px}.good{color:var(--green);font-weight:800}.bad{color:var(--red);font-weight:800}
.hint{color:#59647a;margin-top:16px;font-size:17px}
/* svg */
.tile rect{transition:fill .25s,stroke .25s}.tile.hit rect{fill:#2a3550}
.wbox{transition:opacity .4s}.wbox.spawn{animation:pop 1s ease-out;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.05);opacity:1}100%{transform:scale(1)}}
.mark{transition:transform .6s ease}
.trail{animation:fade 1.3s ease-out forwards}@keyframes fade{from{opacity:.55}to{opacity:0}}
.sent.flash circle{animation:sflash 2s ease-out}@keyframes sflash{0%{fill:#3aa0ff}100%{fill:#0d2740}}
</style>
</head>
<body>
<div class="hdr"><h1>Swarm<span>Shield</span></h1><span class="pill sim">SIMULATION</span><span class="pill mock" id="mockpill" hidden>MOCK DATA</span>
  <span class="pill off" id="shield">SHIELD OFF</span><span class="rnd" id="round"></span><span class="pill paused" id="paused" hidden>PAUSED</span><span class="pill mode" id="mode"></span>
  <span class="keys"><kbd>1</kbd> off <kbd>2</kbd> on <kbd>N</kbd> next <kbd>P</kbd> pause <kbd>A</kbd> auto/step <kbd>E</kbd> end <kbd>X</kbd> reset</span><span class="timer" id="timer">0.0s</span></div>
<div class="phases" id="phases"></div>
<div class="cap" id="cap"></div>
<div class="main">
  <section class="p apip"><svg id="api" viewBox="0 0 1240 830" preserveAspectRatio="xMidYMid meet" font-family="Inter,Segoe UI,system-ui,sans-serif"></svg></section>
  <div class="col">
    <section class="p" style="flex:1.3;display:flex;flex-direction:column"><h2>Swarm detection · are they still a team?</h2>
      <div class="state" id="swstate"></div>
      <svg id="trust" viewBox="0 0 440 385" style="flex:1;min-height:0;width:100%"></svg>
      <div class="leg"><span><i style="background:var(--red)"></i>attacking</span><span><i style="background:var(--orange)"></i>caught</span><span><i style="background:var(--grey)"></i>alone</span>
        <span><svg width="30" height="10"><line x1="0" y1="5" x2="30" y2="5" stroke="#3aa0ff" stroke-width="3" stroke-dasharray="5 3"/></svg>used a teammate's key</span></div></section>
    <section class="p" style="flex:1"><h2>Warden activity</h2><div id="acts"></div></section>
  </div>
</div>
<div class="stats" id="stats"></div>
<div class="banner" id="banner"><div class="bb" id="bannerbox"><div class="bbig" id="bannerbig"></div><div class="sub" id="bannersub"></div>
  <table class="score" id="score"></table><div class="hint">Press <kbd>1</kbd> or <kbd>2</kbd> for a new round, <kbd>X</kbd> to reset</div></div></div>
<script>
const AGENTS = ["recon-1", "creds-2", "exploit-3", "coord-4"];
const MOCK = new URLSearchParams(location.search).has("mock");
const POLL_MS = 300, USD_SCALE = 10000;   // demo: costs shown x10,000 so they read in thousands
const C = { red: "#ff4d5e", orange: "#ff9f1c", blue: "#3aa0ff", gold: "#ffd23f", grey: "#7d8597", green: "#2ee59d", text: "#e6edf7", muted: "#7d8aa3" };
const COL = { active: C.red, flagged: C.orange, lone: C.grey, won: C.gold };
const WORD = { active: "attacking", flagged: "caught", lone: "alone", won: "won" };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (v, d = 1, u = "") => v === null || v === undefined ? "–" : Number(v).toFixed(d) + u;
const usd = v => "$" + Math.round((v || 0) * USD_SCALE).toLocaleString("en-US");
const pct = v => v === null || v === undefined ? "–" : v + "%";
const set = (el, html) => { if (el._h !== html) { el.innerHTML = html; el._h = html; } };
const NS = "http://www.w3.org/2000/svg";
const mk = (tag, attrs, parent, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text !== undefined) e.textContent = text; parent && parent.appendChild(e); return e; };
const short = r => !r ? "" : /honey/.test(r) ? "opened a bait link" : /canary/.test(r) ? "same key, two attackers" : /unpublished/.test(r) ? "went to the hidden /admin"
  : /requests in/.test(r) ? "too fast for a human" : /dead/.test(r) ? "too many dead links" : r;

// ================= API view (static) =================
const svg = $("api");
const CL = { "recon-1": 120, "creds-2": 235, "exploit-3": 350, "coord-4": 465, shopper: 690 }, CX = 92, G0 = 240, G1 = 340;
const REAL = [["root", "Home", "GET /"], ["docs", "API docs", "/api/docs"], ["users", "Users", "/api/v1/users"], ["backup", "Backup file", "/backup/config-…"],
  ["login", "Admin login", "POST /admin/login"], ["flag", "THE PRIZE", "/admin/flag"], ["products", "Products", "/api/v1/products"], ["orders", "Orders", "/api/v1/orders"]];
const RT = {}; REAL.forEach(([k], i) => RT[k] = { x: 432 + (i % 4) * 197, y: 70 + Math.floor(i / 4) * 128, w: 180, h: 108 });
const WK = [["docs", "API docs"], ["users", "Users"], ["backup", "Backup"], ["login", "Admin"], ["hint", "Prize?"]];
const WB = AGENTS.map((a, i) => ({ x: 425 + (i % 2) * 400, y: 392 + Math.floor(i / 2) * 212, w: 385, h: 196 }));
const wtile = (i, k) => { const j = WK.findIndex(w => w[0] === k), b = WB[i]; return { x: b.x + 14 + j * 73, y: b.y + 56, w: 64, h: 74 }; };
const ctr = t => [t.x + t.w / 2, t.y + t.h / 2];

const L = { zones: mk("g", {}, svg) }; L.trails = mk("g", {}, svg); L.tiles = mk("g", {}, svg); L.wardens = mk("g", {}, svg); L.marks = mk("g", {}, svg); L.packets = mk("g", {}, svg); L.clients = mk("g", {}, svg);
// gateway
mk("rect", { x: G0, y: 24, width: G1 - G0, height: 790, rx: 16, fill: "#0a1a2d", stroke: C.blue, "stroke-width": 3 }, L.zones);
mk("text", { x: 290, y: 430, fill: "#8cc8ff", "font-size": 24, "font-weight": 900, "text-anchor": "middle", transform: "rotate(-90 290 430)", "letter-spacing": 4 }, L.zones, "SWARMSHIELD GATEWAY");
const sent = mk("g", { class: "sent" }, L.zones);
mk("circle", { cx: 290, cy: 92, r: 34, fill: "#0d2740", stroke: C.blue, "stroke-width": 3 }, sent);
mk("text", { x: 290, y: 101, fill: "#fff", "font-size": 26, "font-weight": 900, "text-anchor": "middle" }, sent, "S");
mk("text", { x: 290, y: 148, fill: "#8cc8ff", "font-size": 15, "font-weight": 800, "text-anchor": "middle" }, sent, "Sentinel");
// real API
mk("rect", { x: 412, y: 24, width: 815, height: 312, rx: 14, fill: "#151d2c", stroke: C.text, "stroke-width": 2.5 }, L.zones);
mk("text", { x: 432, y: 54, fill: C.text, "font-size": 20, "font-weight": 900 }, L.zones, "REAL API");
mk("text", { x: 1210, y: 54, fill: C.muted, "font-size": 15, "text-anchor": "end" }, L.zones, "what real customers use");
const tileEl = {};
for (const [k, name, path] of REAL) {
  const t = RT[k], g = mk("g", { class: "tile" }, L.tiles), prize = k === "flag", shop = k === "products" || k === "orders";
  mk("rect", { x: t.x, y: t.y, width: t.w, height: t.h, rx: 10, fill: prize ? "#2a2300" : "#1b2333", stroke: prize ? C.gold : shop ? C.green : "#3a4660", "stroke-width": 2.5 }, g);
  mk("text", { x: t.x + 14, y: t.y + 30, fill: prize ? C.gold : shop ? "#8fe9c3" : C.text, "font-size": 18, "font-weight": 800 }, g, name);
  mk("text", { x: t.x + 14, y: t.y + 52, fill: C.muted, "font-size": 13, "font-family": "ui-monospace,monospace" }, g, path);
  tileEl["real:" + k] = g;
}
const prizeTag = mk("text", { x: RT.flag.x + 14, y: RT.flag.y + 94, fill: C.gold, "font-size": 15, "font-weight": 900 }, L.tiles, "");
// wardens
mk("rect", { x: 412, y: 352, width: 815, height: 462, rx: 14, fill: "#0a1a2d", stroke: C.blue, "stroke-width": 2.5, "stroke-dasharray": "12 8" }, L.zones);
mk("text", { x: 432, y: 382, fill: C.blue, "font-size": 20, "font-weight": 900 }, L.zones, "WARDENS");
mk("text", { x: 1210, y: 382, fill: C.muted, "font-size": 15, "text-anchor": "end" }, L.zones, "a fake API spawned for each caught attacker");
const wEl = AGENTS.map((a, i) => {
  const b = WB[i], g = mk("g", { class: "wbox", opacity: 0.25 }, L.wardens), lab = {};
  const box = mk("rect", { x: b.x, y: b.y, width: b.w, height: b.h, rx: 12, fill: "#0d2238", stroke: "#2a3446", "stroke-width": 2, "stroke-dasharray": "6 5" }, g);
  const title = mk("text", { x: b.x + 14, y: b.y + 32, fill: "#59647a", "font-size": 18, "font-weight": 900 }, g, `W-${a}`);
  const sub = mk("text", { x: b.x + b.w - 14, y: b.y + 32, fill: "#59647a", "font-size": 14, "text-anchor": "end" }, g, "not spawned");
  for (const [k, name] of WK) {
    const t = wtile(i, k), tg = mk("g", { class: "tile" }, g);
    mk("rect", { x: t.x, y: t.y, width: t.w, height: t.h, rx: 8, fill: "#10304f", stroke: "#2c6aa8", "stroke-width": 2 }, tg);
    mk("text", { x: t.x + t.w / 2, y: t.y + 22, fill: "#9fd0ff", "font-size": 13, "font-weight": 800, "text-anchor": "middle" }, tg, name);
    lab[k] = mk("text", { x: t.x + t.w / 2, y: t.y + t.h + 18, fill: "#59647a", "font-size": 11, "text-anchor": "middle", "font-family": "ui-monospace,monospace" }, g, "");
    tileEl[`w${i}:${k}`] = tg;
  }
  return { g, box, title, sub, lab, on: false };
});
// clients
const clientEl = {};
mk("text", { x: CX, y: 54, fill: "#ff8a95", "font-size": 16, "font-weight": 900, "text-anchor": "middle" }, L.clients, "AI ATTACKERS");
mk("text", { x: CX, y: 620, fill: "#8fe9c3", "font-size": 16, "font-weight": 900, "text-anchor": "middle" }, L.clients, "REAL CUSTOMER");
for (const a of [...AGENTS, "shopper"]) {
  const y = CL[a], g = mk("g", {}, L.clients), shop = a === "shopper";
  const c = mk("circle", { cx: CX, cy: y, r: 28, fill: shop ? C.green : C.red, stroke: "#0b0f17", "stroke-width": 4 }, g);
  mk("text", { x: CX, y: y + 50, fill: shop ? "#8fe9c3" : "#ffb3ba", "font-size": 16, "font-weight": 800, "text-anchor": "middle" }, g, shop ? "shopper" : a);
  const w = mk("text", { x: CX, y: y + 68, fill: C.muted, "font-size": 13, "font-weight": 800, "text-anchor": "middle" }, g, shop ? "logged in" : "");
  clientEl[a] = { c, w };
}
// a marker per attacker showing where it is right now
const marks = {};
AGENTS.forEach((a, i) => {
  const g = mk("g", { opacity: 0 }, L.marks);
  const c = mk("circle", { cx: 0, cy: 0, r: 13, fill: C.red, stroke: "#0b0f17", "stroke-width": 3 }, g);
  mk("text", { x: 0, y: 5, fill: "#fff", "font-size": 13, "font-weight": 900, "text-anchor": "middle" }, g, a[0].toUpperCase());
  marks[a] = { g, c };
});

function realKey(p) {
  p = p || "/";
  if (/products/.test(p)) return "products"; if (/orders/.test(p)) return "orders";
  if (/\/flag$/.test(p)) return "flag"; if (/login$/.test(p)) return "login";
  if (/backup/.test(p)) return "backup"; if (/users/.test(p)) return "users";
  if (/docs|openapi/.test(p)) return "docs"; return "root";
}
function wardenKey(p) {
  p = p || "/";
  if (/mfa|seed-|\/flag$/.test(p)) return "hint"; if (/login$|admin|console|panel|mgmt|root/.test(p) && !/users|backup|docs/.test(p)) return "login";
  if (/backup/.test(p)) return "backup"; if (/users/.test(p)) return "users"; return "docs";
}
function target(r) {
  const i = AGENTS.indexOf(r.session);
  if (r.routed === "reality" && i >= 0) { const k = wardenKey(r.path); return { el: `w${i}:${k}`, xy: ctr(wtile(i, k)), col: C.orange }; }
  const k = realKey(r.path); return { el: "real:" + k, xy: ctr(RT[k]), col: r.routed === "forward_legit" || r.session === "shopper" ? C.green : C.red };
}

const seen = new Set();
function packets(s) {
  let n = 0;
  for (const r of s.requests || []) {
    const key = `${s.round}|${r.t}|${r.session}|${r.method}|${r.path}|${r.status}`;
    if (seen.has(key)) continue;
    seen.add(key);
    if (s.t - r.t > 2.5 || n++ > 10 || CL[r.session] === undefined) continue;
    const tg = target(r), y = CL[r.session], [tx, ty] = tg.xy;
    const d = `M${CX + 28},${y} L${G0},${y} L${G1},${y} L${tx},${ty}`;
    const tr = mk("path", { d, fill: "none", stroke: tg.col, "stroke-width": 3, class: "trail" }, L.trails);
    const c = mk("circle", { r: 8, fill: tg.col, stroke: "#0b0f17", "stroke-width": 2 }, L.packets);
    const am = mk("animateMotion", { dur: "0.9s", path: d, fill: "freeze", begin: "indefinite" }, c);
    am.beginElement();
    setTimeout(() => {
      c.remove();
      const el = tileEl[tg.el]; if (el) { el.classList.add("hit"); setTimeout(() => el.classList.remove("hit"), 450); }
      if ((r.status || 200) >= 400 && r.routed === "reality") {
        const x = mk("text", { x: tx + 18, y: ty - 18, fill: C.red, "font-size": 30, "font-weight": 900, class: "trail" }, L.packets, "✗");
        setTimeout(() => x.remove(), 1400);
      }
    }, 900);
    setTimeout(() => tr.remove(), 1400);
  }
  if (seen.size > 4000) seen.clear();
}

let lastDetections = 0, booted = false;
function apiView(s) {
  const by = {}; s.agents.forEach(a => by[a.id] = a);
  for (const a of AGENTS) {
    const st = by[a]?.status || "active";
    clientEl[a].c.setAttribute("fill", COL[st]); clientEl[a].w.textContent = s.round ? WORD[st] : "";
    clientEl[a].w.setAttribute("fill", COL[st]);
  }
  const won = !!s.captured_by;
  prizeTag.textContent = won ? `STOLEN by ${s.captured_by}` : s.shield && s.round ? "safe" : "";
  prizeTag.setAttribute("fill", won ? C.red : C.green);
  AGENTS.forEach((a, i) => {
    const r = by[a]?.reality, W = wEl[i];
    if (!!r !== W.on) {
      W.on = !!r; W.g.classList.toggle("spawn", W.on && booted);   // pop only when spawned live, not on page load W.g.setAttribute("opacity", W.on ? 1 : 0.25);
      W.box.setAttribute("stroke", W.on ? C.blue : "#2a3446"); W.box.setAttribute("stroke-dasharray", W.on ? "" : "6 5");
      W.title.setAttribute("fill", W.on ? "#8cc8ff" : "#59647a"); W.sub.setAttribute("fill", W.on ? C.orange : "#59647a");
    }
    W.sub.textContent = r ? `fake API for ${a}` : s.shield ? "waiting" : "Shield OFF";
    W.lab.login.textContent = r ? r.admin_path : ""; W.lab.hint.textContent = r ? "moved…" : "";
  });
  // where each attacker is now: its latest request
  const last = {}; for (const r of s.requests || []) if (by[r.session]) last[r.session] = r;
  const crowd = {};
  AGENTS.forEach((a, i) => {
    const r = last[a], m = marks[a];
    if (!r || !s.round) { m.g.setAttribute("opacity", 0); return; }
    const tg = target(r), n = crowd[tg.el] = (crowd[tg.el] || 0) + 1;
    const inW = r.routed === "reality", [x, y] = tg.xy;
    const dx = inW ? 0 : -54 + n * 24, dy = inW ? 6 : 32;
    m.g.setAttribute("opacity", 1); m.g.style.transform = `translate(${x + dx}px,${y + dy}px)`;
    if (!m.placed) { m.placed = true; requestAnimationFrame(() => m.g.classList.add("mark")); }   // no fly-in from 0,0 on first frame
    m.c.setAttribute("fill", COL[by[a].status] || C.red);
  });
  const nd = (s.detections || []).length;
  if (nd > lastDetections) { sent.classList.remove("flash"); void sent.getBBox(); sent.classList.add("flash"); }
  lastDetections = nd;
  packets(s);
  booted = true;
}

// ================= right side =================
function swarmView(s) {
  const m = s.metrics, by = {}; s.agents.forEach(a => by[a.id] = a);
  const caught = s.agents.filter(a => a.status === "flagged" || a.status === "lone").length;
  const [txt, col] = !s.round ? ["–", C.text] : s.captured_by ? ["A TEAM · and it won", C.red]
    : m.lone_agents >= 3 ? [`SPLIT · ${m.lone_agents} of 4 alone`, C.blue]
    : m.lone_agents ? [`FALLING APART · ${m.lone_agents} of 4 alone`, C.orange]
    : caught ? [`SWARM DETECTED · ${caught} of 4 caught`, C.blue]
    : ["A TEAM · sharing keys", C.red];
  $("swstate").textContent = txt; $("swstate").style.color = col;
  const P = { "recon-1": [220, 55], "creds-2": [380, 180], "exploit-3": [220, 305], "coord-4": [60, 180] };
  const tv = {}; (s.trust || []).forEach(t => tv[t.a + ">" + t.b] = t.value);
  let g = `<defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#3aa0ff"/></marker></defs>`;
  for (const a of AGENTS) for (const b of AGENTS) if (a < b) {
    const v = ((tv[a + ">" + b] ?? 1) + (tv[b + ">" + a] ?? 1)) / 2, gone = by[a]?.status === "lone" || by[b]?.status === "lone";
    g += `<line x1="${P[a][0]}" y1="${P[a][1]}" x2="${P[b][0]}" y2="${P[b][1]}" stroke="${gone ? "#3a4150" : v < .95 ? C.orange : C.text}" stroke-width="${1 + 10 * v}" stroke-opacity="${.12 + .7 * v}" ${v < (s.trust_ignore_below ?? .3) ? 'stroke-dasharray="4 8"' : ""}/>`;
  }
  for (const l of (s.links || [])) {
    if (!P[l.a] || !P[l.b]) continue;
    const [x1, y1] = P[l.a], [x2, y2] = P[l.b], mx = (x1 + x2) / 2 + (y2 - y1) * .18, my = (y1 + y2) / 2 - (x2 - x1) * .18;
    g += `<path d="M${x1},${y1} Q${mx},${my} ${x2},${y2}" fill="none" stroke="#3aa0ff" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#ab)"/>`;
  }
  for (const a of AGENTS) {
    const [x, y] = P[a], st = by[a]?.status || "active";
    g += `<circle cx="${x}" cy="${y}" r="40" fill="${COL[st]}33" stroke="${COL[st]}" stroke-width="5"/>
      <text x="${x}" y="${y + 6}" fill="#fff" font-size="18" font-weight="900" text-anchor="middle">${a.split("-")[0]}</text>
      <text x="${x}" y="${y + 60}" fill="${COL[st]}" font-size="14" font-weight="800" text-anchor="middle">${st === "active" ? "" : WORD[st]}</text>`;
  }
  set($("trust"), g);
}

const KIND = v => /^ak_/.test(v) ? "key" : /^cfg_/.test(v) ? "config" : /^pw_/.test(v) ? "password" : /^adm_/.test(v) ? "token" : "admin path";
function activity(s) {
  if (!s.shield) { set($("acts"), `<div class="act" style="color:#ff8a95">Shield OFF · no Sentinel, no Wardens. Every request goes to the real API.</div>`); return; }
  const it = [];
  for (const d of s.detections || []) it.push([d.t, C.blue, `Sentinel: swarm spotted · ${esc(short(d.reason))}`]);
  for (const a of s.agents) {
    if (a.reality && a.flagged_at != null) it.push([a.flagged_at + 0.01, "#8cc8ff", `${esc(a.reality.warden || "W-" + a.id)} spawned · ${a.id} now gets a fake API`]);
    if (a.lone_at != null) it.push([a.lone_at, C.grey, `${a.id} stopped trusting its team`]);
  }
  for (const b of s.blocks || []) if (b.from && b.from !== b.session && AGENTS.includes(b.from))
    it.push([b.t, C.orange, `W-${esc(b.session)} rejected ${esc(b.from)}'s ${KIND(b.item || "")} ✗`]);
  it.sort((x, y) => y[0] - x[0]);
  set($("acts"), it.slice(0, 9).map(([t, c, x]) => `<div class="act"><span class="t">${fmt(t)}s</span><span style="color:${c}">${x}</span></div>`).join("")
    || `<div class="act" style="color:#59647a">Sentinel is watching every request…</div>`);
}

function phase(s) {
  const m = s.metrics, n = s.agents.filter(a => a.reality).length;
  if (!s.shield) return s.captured_by ? 3 : s.board.some(p => p.kind === "finding") ? 2 : 1;
  if (m.lone_agents >= 1) return 5;
  if (m.contradictions > 0 || s.agents.some(a => a.rejected)) return 4;
  if (n >= 1) return 3;
  return (s.detections || []).length ? 2 : 1;
}
const PH_ON = [["Attackers hit the API", "red"], ["Sentinel spots the swarm", "blue"], ["Wardens spawn fake APIs", "blue"], ["Shared tips start failing", "orange"], ["The swarm falls apart", "blue"]];
const PH_OFF = [["Attackers hit the API", "red"], ["They share keys", "red"], ["They steal the prize", "red"]];
function caption(s, p) {
  const n = s.agents.filter(a => a.reality).length;
  if (s.paused && !(MODE === "step" && gate.stage)) return "Paused · press P to resume";
  if (!s.round) return "Press 1 for a round without SwarmShield, 2 for a round with it.";
  if (!s.shield) return [, "Shield OFF: four AI attackers hit the real API and share every key they find.",
    "They pass keys to each other, so each one starts where the last one stopped.",
    `${s.captured_by} stole the prize in ${fmt(s.metrics.time_to_flag, 0)} seconds. Nobody was defending.`][p];
  return [, "Every request goes through the gateway. Each attacker is quietly given its own copy of every key.",
    "Sentinel: a key given to one attacker came back from another. That's a team.",
    `Each caught attacker is rerouted to its own Warden, a fake API. ${n} of 4 so far. The real customer still uses the real API.`,
    "Every attacker now sees a different fake API, so tips its teammates share fail for it.",
    `${s.metrics.lone_agents} of 4 attackers stopped trusting the team. The prize is safe.`][p];
}

function stats(s) {
  const m = s.metrics, on = s.shield, n = s.agents.filter(a => a.reality).length, det = (s.detections || []).length, ok = m.legit_ok || 0, tot = ok + (m.legit_fail || 0);
  const cards = [[m.attacker_success ? "STOLEN" : on && det ? "SAFE" : s.round ? "at risk" : "–", "Prize", m.attacker_success ? C.red : on && det ? C.green : ""],
    [m.attacker_success && !on ? fmt(m.time_to_flag, 1, "s") : fmt(m.time_to_detect, 1, "s"), m.attacker_success && !on ? "Time to steal it" : "Time to spot the swarm", m.attacker_success && !on ? C.red : C.blue],
    [`${n} / 4`, "Wardens spawned", n ? C.blue : ""],
    [m.contradictions, "Shared tips that failed", m.contradictions ? C.orange : ""],
    [`${m.lone_agents} / 4`, "Attackers gone alone", m.lone_agents ? C.grey : ""],
    [tot ? `${ok} / ${tot}` : "–", "Real customer requests OK", tot ? (ok === tot ? C.green : C.red) : ""],
    [usd(m.attacker_cost), `Attacker $ burned · defence ${usd(m.defender_cost)}`, m.attacker_cost ? C.orange : ""]];
  set($("stats"), cards.map(([v, l, c]) => `<div class="stat"><div class="v" style="color:${c || C.text}">${v}</div><div class="l">${l}</div></div>`).join(""));
}

function banner(s) {
  const m = s.metrics, show = s.ended;
  $("banner").classList.toggle("show", !!show);
  if (!show) return;
  const loss = !!s.captured_by;
  $("bannerbox").className = "bb" + (loss ? " loss" : "");
  set($("bannerbig"), loss ? `<span style="color:${C.red}">PRIZE STOLEN</span> in ${fmt(m.time_to_flag ?? s.t, 0)}s`
    : `<span style="color:${C.green}">PRIZE SAFE</span>${m.time_to_detect != null ? ` · swarm spotted in ${fmt(m.time_to_detect, 1)}s` : ""}`);
  $("bannersub").textContent = `${m.contradictions} shared tips failed · ${m.lone_agents} of 4 attackers alone · real customer ${pct(s.legit_pct)} OK`;
  const rs = (s.results || []).slice(-4);
  if (!rs.length) { set($("score"), ""); return; }
  const row = (label, f) => `<tr><td>${label}</td>${rs.map(f).join("")}</tr>`;
  set($("score"), `<tr><th></th>${rs.map(r => `<th>Round ${r.round} · Shield ${r.shield ? "ON" : "OFF"}</th>`).join("")}</tr>` +
    row("Prize", r => `<td class="${r.flag ? "bad" : "good"}">${r.flag ? "STOLEN " + fmt(r.time_to_flag, 0) + "s" : "SAFE"}</td>`) +
    row("Time to spot the swarm", r => `<td>${fmt(r.time_to_detect, 1, "s")}</td>`) +
    row("Shared tips that failed", r => `<td>${r.contradictions ?? "–"}</td>`) +
    row("Attackers gone alone", r => `<td>${r.lone_agents ?? 0} / 4</td>`) +
    row("Real customer OK", r => `<td class="${r.legit_pct == null ? "" : r.legit_pct === 100 ? "good" : "bad"}">${pct(r.legit_pct)}</td>`) +
    row("Attacker $ burned / defence $", r => `<td>${usd(r.attacker_cost)} / ${usd(r.defender_cost)}</td>`));
}

// step mode (default): pause the round as each stage begins; N moves on. auto: run straight through.
let MODE = localStorage.getItem("swarmshield.mode") || "step";
let gate = { round: null, stage: 0 };
function stepGate(s, p) {
  if (MODE !== "step" || MOCK || !s.round || !s.running) return p;
  if (gate.round !== s.round) gate = { round: s.round, stage: s.t > 3 ? p - 1 : 0, waiting: false };   // joined mid-round: stop at the current stage
  if (gate.waiting) { if (s.paused) gate.waiting = false; }             // our pause hasn't shown up in the state yet
  else if (p > gate.stage && !s.paused) { gate.stage += 1; gate.waiting = true; post("/api/round/pause"); }
  return Math.min(p, gate.stage);
}

function render(s) {
  s.agents = AGENTS.map(id => (s.agents || []).find(a => a.id === id) || { id, status: "active" });
  s.board = s.board || [];
  if (s.legit_pct === undefined) { const n = (s.metrics.legit_ok || 0) + (s.metrics.legit_fail || 0); s.legit_pct = n ? Math.round(100 * s.metrics.legit_ok / n) : null; }
  const p = stepGate(s, phase(s)), on = s.shield;
  $("shield").className = "pill " + (on ? "on" : "off"); $("shield").textContent = "SHIELD " + (on ? "ON" : "OFF");
  $("round").textContent = s.round ? `Round ${s.round}${s.running ? "" : " · ended"}` : "";
  $("paused").hidden = !s.paused;
  $("mode").textContent = MODE === "step" ? (s.paused && gate.stage ? "STEP · press N for next stage" : "STEP MODE") : "AUTO";
  $("timer").textContent = fmt(s.t) + "s";
  const ph = on ? PH_ON : PH_OFF;
  set($("phases"), [0, 1, 2, 3, 4].map(i => ph[i] ? `<div class="ph ${!s.round ? "" : i + 1 < p ? "done" : i + 1 === p ? "now " + ph[i][1] : ""}"><i>${i + 1}</i>${ph[i][0]}</div>` : `<div class="ph empty"></div>`).join(""));
  $("cap").textContent = caption(s, p); $("cap").style.color = s.paused && !(MODE === "step" && gate.stage) ? C.gold : p <= 1 || !on ? "#ffb3ba" : p === 4 ? "#ffcf8a" : "#9fd0ff";
  apiView(s); swarmView(s); activity(s); stats(s); banner(s);
}

async function poll() {
  try { const r = await fetch(MOCK ? "/static/mock_state.json" : "/api/state", { cache: "no-store" }); if (r.ok) render(await r.json()); }
  catch (e) { /* hub restarting; keep last frame */ }
  setTimeout(poll, POLL_MS);
}
const post = p => MOCK ? null : fetch(p, { method: "POST" }).catch(() => {});
addEventListener("keydown", e => {
  if (e.repeat || e.ctrlKey || e.metaKey) return;
  const k = e.key.toLowerCase();
  if (k === "1") post("/api/round/off"); else if (k === "2") post("/api/round/on");
  else if (k === "p" || k === " ") { e.preventDefault(); post("/api/round/toggle"); }
  else if (k === "n" || e.key === "ArrowRight") post("/api/round/resume");
  else if (k === "a") { MODE = MODE === "step" ? "auto" : "step"; localStorage.setItem("swarmshield.mode", MODE); if (MODE === "auto") post("/api/round/resume"); }
  else if (k === "e") post("/api/round/stop"); else if (k === "x") post("/api/reset");
});
$("mockpill").hidden = !MOCK;
poll();
</script>
</body>
</html>
